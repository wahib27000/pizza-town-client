<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation de commande - Pizza Town</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 600px; margin: 40px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h2>Finaliser votre commande</h2>
        
        <form id="form-commande" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
            <div>
                <label for="nom-client" style="font-weight: bold; display: block; margin-bottom: 5px;">Nom et Prénom :</label>
                <input type="text" id="nom-client" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div>
                <label for="tel-client" style="font-weight: bold; display: block; margin-bottom: 5px;">Téléphone :</label>
                <input type="tel" id="tel-client" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div id="champ-ville-wrapper">
                <label for="ville-client" style="font-weight: bold; display: block; margin-bottom: 5px;">Ville de livraison :</label>
                <select id="ville-client" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="Louviers">Louviers</option>
                    <option value="Incarville">Incarville</option>
                    <option value="Le Vaudreuil">Le Vaudreuil</option>
                </select>
            </div>

            <button type="submit" style="background: #2a9d8f; color: white; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1rem;">Valider et transmettre la commande</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
